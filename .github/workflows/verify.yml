name: Verify horizon study
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Numerical identities and cached observational reproduction
        run: python verify_results.py
      - name: Browser/Python physics parity and standalone content
        run: node tests/check_lab.cjs
      - name: Repeat the frozen synthetic matrix
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python run_synthetic.py
      - name: Reassess scientific calibration without hiding FAIL results
        run: python verify_results.py
